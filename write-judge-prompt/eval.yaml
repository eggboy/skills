name: write-judge-prompt-eval
description: 'Evaluation suite for write-judge-prompt. Design LLM-as-Judge evaluators
  for subjective criteria that code-based checks cannot handle. Use when a failure
  mode requires interpretation (tone, faithfulness, relevance, completeness). Do NOT
  use when the failure mode can be checked with code (regex, schema validation, execution
  tests). Do NOT use when you need to validate or calibrate the judge — use validate-evaluator
  instead.

  '
skill: write-judge-prompt
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: true
  model: anthropic/claude-opus-4.6
  executor: copilot-sdk
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the skill complete the assigned task?
graders:
- type: code
  name: has_output
  config:
    assertions:
    - len(output) > 0
- type: text
  name: no_errors
  config:
    regex_not_match:
    - (?i)fatal error
    - (?i)exception occurred
tasks:
- tasks/*.yaml
